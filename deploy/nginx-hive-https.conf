# HIVE 反向代理 —— 转发到本机 Docker 容器 127.0.0.1:8787
#
# 与 pixel-blog 同一套模式：
#   公网 443 (OpenResty) → 127.0.0.1:8787 (hive 容器)
# 容器自己只绑回环，不直接暴露公网；HTTPS / gzip 全由 OpenResty 负责。
#
# 证书由 acme.sh 签发并自动续期（续期后 reload openresty）。
# 装法：/opt/hive/apply-nginx.sh --https

upstream hive_upstream {
    server 127.0.0.1:8787;
    keepalive 16;
}

# HTTP → HTTPS 跳转（保留 ACME 验证路径，否则续期会失败）
server {
    listen 80;
    listen [::]:80;
    server_name hive-new.cwa1e.top;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hive-new.cwa1e.top;

    ssl_certificate     /www/ssl/hive-new.cwa1e.top/fullchain.pem;
    ssl_certificate_key /www/ssl/hive-new.cwa1e.top/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS 先短。应用层已经在发 max-age=15552000，这里不重复加长的，
    # 避免两边不一致；等稳定后再统一。
    add_header Strict-Transport-Security "max-age=86400" always;

    client_max_body_size 8m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # 带内容哈希的静态资源：浏览器可以长缓存（应用层也发了 immutable，
    # 这里再加一层，即使应用头被中间层吃掉也不影响）
    location /assets/ {
        proxy_pass http://hive_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://hive_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 应用用 APP_ORIGIN 判断 Cookie 要不要 Secure，真实 scheme 必须传
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        # 不缓冲：SQLite 查询很快，缓冲反而多一份内存
        proxy_buffering off;
    }
}
