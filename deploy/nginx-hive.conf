# HIVE 反向代理 —— 转发到本机 Docker 容器 127.0.0.1:8787
#
# 与 pixel-blog 同一套模式：
#   公网 443 (OpenResty) → 127.0.0.1:8787 (hive 容器)
# 容器自己只绑回环，不直接暴露公网；HTTPS / gzip 全由 OpenResty 负责。
#
# 阶段一（现在）：只有 80 端口 + ACME 验证路径。
#   域名 hive-new.cwa1e.top 还没解析到本机，签不了证书。
# 阶段二（DNS 生效后）：跑 /opt/hive/enable-https.sh，
#   它会签证书并把这文件的 443 段打开。

upstream hive_upstream {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name hive-new.cwa1e.top;

    # Let's Encrypt / acme.sh 的 HTTP-01 验证
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    # 先把 HTTP 直接反代过去（HTTPS 就绪后这里会改成 301 跳转）
    location / {
        proxy_pass http://hive_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 应用用 APP_ORIGIN 判断 Cookie 要不要 Secure，这里把真实 scheme 传过去
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
