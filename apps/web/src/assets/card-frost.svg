<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- 一块 400×400 的细砂：比卡片大，铺到卡面上时一整张就盖住，不会出现平铺接缝。
       基频 1.0 @400px ≈ 1px 颗粒，细而均匀，没有大块明暗。 -->
  <filter id="frost" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="1.0" numOctaves="1" seed="43" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="0.7" intercept="0.15"/>
      <feFuncG type="linear" slope="0.7" intercept="0.15"/>
      <feFuncB type="linear" slope="0.7" intercept="0.15"/>
      <feFuncA type="linear" slope="0.5"/>
    </feComponentTransfer>
  </filter>
  <rect width="400" height="400" filter="url(#frost)"/>
</svg>
